name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Publishes a release without pushing a tag first: CI creates the tag on the built commit.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to create and release (e.g. v0.1.0-alpha). Empty = build only."
        required: false
        default: ""

permissions:
  contents: read

env:
  NDK_VERSION: "29.0.14206865"

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # "basic" = the MIT-licensed provider built on actions/cache (v6 defaults to a proprietary one).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install NDK, SDK platform and gawk
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gawk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Theme contrast check (WCAG AA)
        run: python3 scripts/check_contrast.py

      - name: Build PRoot from source
        run: ./gradlew :runtime:buildProot

      - name: Unit tests
        run: ./gradlew testDebugUnitTest testFullDebugUnitTest

      # Signs release APKs only when all four secrets exist; otherwise builds them unsigned.
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release signing: enabled"
          else
            echo "::notice::Release signing skipped: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD are not all set. Release APKs are unsigned."
          fi

      - name: Assemble debug and release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleFullDebug :app:assembleFullRelease :app:assembleFullDebugAndroidTest

      - name: Report release signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          for apk in app/build/outputs/apk/full/release/*.apk; do
            if "$APKSIGNER" verify "$apk" > /dev/null 2>&1; then echo "signed:   $apk"; else echo "unsigned: $apk"; fi
          done
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Lint
        run: ./gradlew :app:lintFullDebug

      - name: Package PRoot source (GPL)
        run: scripts/package-proot-source.sh zakdroid-proot-source.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: zakdroid-code-apks
          path: |
            app/build/outputs/apk/full/debug/*.apk
            app/build/outputs/apk/full/release/*.apk

      # x86_64 app + instrumentation APK for the emulator job.
      - uses: actions/upload-artifact@v7
        with:
          name: emulator-apks
          retention-days: 7
          path: |
            app/build/outputs/apk/full/debug/app-full-x86_64-debug.apk
            app/build/outputs/apk/androidTest/full/debug/app-full-debug-androidTest.apk

      - uses: actions/upload-artifact@v7
        with:
          name: proot-source
          path: zakdroid-proot-source.tar.gz

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/lint-results-fullDebug.html
            **/build/reports/tests/

  # Instrumented smoke tests on an Android emulator (S3). SmokeTest needs no network;
  # ToolchainTest installs the real toolchain (~300 MB) and is skipped for pull requests.
  emulator:
    name: Emulator smoke tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Download test APKs
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: emulator-apks
          path: apks
      - name: Download test APKs (retry)
        if: steps.download.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: emulator-apks
          path: apks

      - name: Collect APKs in one folder
        run: find apks -mindepth 2 -name '*.apk' -exec mv -t apks/ {} + && ls -l apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on an Android 14 emulator (x86_64, phone)
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emulator-tests.sh apks emulator-results ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Test summary
        if: always()
        run: cat emulator-results/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No summary (the emulator did not start?)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-results
          retention-days: 14
          path: emulator-results/

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      # Artifact storage sometimes fails a download (O10): try again once after a pause.
      - name: Download build outputs
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: "{zakdroid-code-apks,proot-source}"
          path: artifacts
      - name: Wait before retrying the download
        if: steps.download.outcome == 'failure'
        run: rm -rf artifacts && sleep 60
      - name: Download build outputs (retry)
        if: steps.download.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          pattern: "{zakdroid-code-apks,proot-source}"
          path: artifacts

      # Pre-release tags (containing "-", e.g. v0.1.0-alpha) ship installable debug APKs;
      # final tags ship the release APKs (signed when the signing secrets are set).
      - name: Collect assets and checksums
        id: assets
        run: |
          mkdir dist
          if [[ "$TAG" == *-* ]]; then
            cp artifacts/zakdroid-code-apks/debug/app-full-arm64-v8a-debug.apk artifacts/zakdroid-code-apks/debug/app-full-universal-debug.apk dist/
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            cp artifacts/zakdroid-code-apks/release/app-full-arm64-v8a-release*.apk artifacts/zakdroid-code-apks/release/app-full-universal-release*.apk dist/
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          cp artifacts/proot-source/zakdroid-proot-source.tar.gz dist/
          cd dist
          sha256sum * > SHA256SUMS.txt
          {
            echo "## zakdroid-code $TAG"
            echo
            echo "- **app-full-arm64-v8a-*.apk**: for almost all phones and tablets (smaller download)."
            echo "- **app-full-universal-*.apk**: arm64-v8a + x86_64 (emulators, Chromebooks)."
            echo "- **zakdroid-proot-source.tar.gz**: complete source of the bundled PRoot/talloc binaries (GPL-2.0-or-later / LGPL-3.0-or-later)."
            if [[ "$TAG" == *-* ]]; then
              echo
              echo "> Alpha build, signed with a CI debug key. A later build signed with a different key needs an uninstall first."
            fi
            echo
            echo "### SHA-256"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > ../RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          prerelease: ${{ steps.assets.outputs.prerelease }}
          body_path: RELEASE_NOTES.md
          files: dist/*
