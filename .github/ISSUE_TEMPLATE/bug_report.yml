name: Bug report / بلاغ عن خطأ
description: Something does not work as expected. / شيء لا يعمل كما ينبغي.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: do not report them here. See SECURITY.md.
        الثغرات الأمنية: لا تُبلغ عنها هنا، راجع SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened? / ماذا حدث؟
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / خطوات إعادة المشكلة
      placeholder: |
        1. Open …
        2. Tap …
        3. …
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / بيانات التشخيص
      description: Settings → About → Copy diagnostics, then paste here. / الإعدادات ← حول ← نسخ بيانات التشخيص.
      render: text
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version / الجهاز وإصدار Android
      placeholder: e.g. Honor Pad 10, Android 14
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or other details / لقطات شاشة أو تفاصيل أخرى
